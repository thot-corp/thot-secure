[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thotsecure-sdk"
version = "0.1.0"
description = "SDK Python officiel pour l'API Thot Secure (SOAR/CSPM défensif) — zéro dépendance obligatoire"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Projet Thot Secure" }]
keywords = ["thotsecure", "soar", "cspm", "security", "sdk", "defensive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# ZÉRO dépendance runtime : le SDK s'exécute sur la seule bibliothèque standard.
# `httpx` est un extra optionnel ; s'il est présent, il est utilisé automatiquement,
# sinon le client bascule sur `urllib.request` (urllib.request est dans la stdlib).
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/thotsecure/thot-secure"
Documentation = "https://github.com/thotsecure/thot-secure/blob/main/docs/architecture/api-contract.md"
Source = "https://github.com/thotsecure/thot-secure"

[tool.setuptools]
packages = ["thotsecure_sdk"]

[tool.setuptools.package-data]
thotsecure_sdk = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
