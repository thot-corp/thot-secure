name: rotate-secret
description: >-
  Déclenche la rotation d'un secret exposé (clé d'API, mot de passe de service, jeton).
  **Irréversible** : un secret tourné ne revient pas en arrière. Exige donc une approbation
  humaine systématique, et suppose que les consommateurs du secret savent le relire depuis le
  coffre.
reversible: false
dry_run_capable: true
connectors: [secretstore]
params:
  target:
    type: secret
    required: true
    description: Identifiant du secret à tourner (chemin dans le coffre, nom de la clé).
  reason:
    type: string
    default: "Thot Secure — rotation de secret exposé"
    description: Motif de la rotation (fuite suspectée, départ, politique périodique).
execute:
  - connector: secretstore
    call: rotate_secret
    with:
      secret: "${params.target}"
      note: "${params.reason}"
  - connector: notify
    call: notify
    optional: true
    with:
      message: "Rotation du secret ${params.target} effectuée — vérifier que les consommateurs ont rechargé la nouvelle valeur."
  - connector: ticketing
    call: open_ticket
    optional: true
    with:
      title: "Rotation de secret : ${params.target}"
      severity: critical
      tenant_id: "${tenant.id}"
      finding_id: "${finding.id}"
      action_id: "${action.id}"
      description: "${params.reason}"
      remediation: "Redéployer les consommateurs du secret, vérifier l'absence d'utilisation de l'ancienne valeur dans les journaux, contrôler les accès au coffre."
audit:
  severity: critical
  notify: [ticketing]
