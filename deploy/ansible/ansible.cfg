; =============================================================================
; Thot Secure — configuration Ansible locale au répertoire deploy/ansible/
; -----------------------------------------------------------------------------
; Ce fichier est chargé automatiquement lorsque vous lancez ansible-playbook
; depuis deploy/ansible/. Il ne modifie PAS votre ~/.ansible.cfg global.
;
; Démarrage rapide :
;   cd deploy/ansible
;   cp inventory.example.ini inventory.ini   ; puis éditez les hôtes
;   ansible-galaxy collection install -r requirements.yml
;   ansible-playbook -i inventory.ini playbook-install.yml --check --diff
; =============================================================================

[defaults]
; Inventaire par défaut : copiez inventory.example.ini vers inventory.ini.
; inventory.ini est volontairement ignoré par .gitignore (contient vos hôtes).
inventory = inventory.ini

; Les rôles sont cherchés dans deploy/ansible/roles/.
roles_path = roles

; SÉCURITÉ : on vérifie les empreintes SSH des hôtes. Ne passez à False que
; pour un premier provisioning sur une infrastructure jetable et maîtrisée.
host_key_checking = True

; Pas de fichier .retry : les tâches sont idempotentes, on relance le playbook
; complet plutôt qu'une liste partielle souvent périmée.
retry_files_enabled = False

; Sortie lisible en YAML. Ce callback est fourni par la collection
; community.general (déclarée dans requirements.yml).
stdout_callback = yaml

; profile_tasks affiche le temps passé par tâche : utile pour repérer les
; étapes lentes (pip install, certbot, apt).
callbacks_enabled = profile_tasks

; Ne pas avertir si l'interpréteur Python détecté n'est pas celui attendu :
; le rôle crée de toute façon son propre venv avec thotsecure_python.
interpreter_python = auto_silent

; gathering = smart ne relance les facts que si le cache est vide ou expiré.
gathering = smart

; Cache de facts : accélère fortement les relances et les --check.
fact_caching = jsonfile
fact_caching_connection = .ansible_cache
fact_caching_timeout = 86400

; On veut voir les avertissements de dépréciation : ils annoncent souvent une
; rupture lors de la prochaine mise à jour majeure d'ansible-core.
deprecation_warnings = True

[privilege_escalation]
; L'installation touche /etc, /opt, /var et systemd : sudo est requis.
become = True
become_method = sudo
become_user = root
; Jamais de prompt interactif : le mot de passe sudo doit venir d'un vault
; (ansible_become_password) ou d'un NOPASSWD ciblé sur l'utilisateur de déploiement.
become_ask_pass = False

[ssh_connection]
; pipelining réduit fortement le nombre d'allers-retours SSH. Il exige
; « requiretty » désactivé côté sudoers (comportement par défaut des
; distributions récentes).
pipelining = True

; Multiplexage SSH : une seule connexion TCP réutilisée pour tout le play.
; PreferredAuthentications=publickey interdit explicitement l'authentification
; par mot de passe : le déploiement se fait par clé SSH uniquement.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
