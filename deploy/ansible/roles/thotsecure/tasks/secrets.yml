---
# =============================================================================
# tasks/secrets.yml — matériel cryptographique du service
# -----------------------------------------------------------------------------
# OBJECTIF : le service dispose TOUJOURS d'une THOT_SECRET_KEY forte, et
#           cette valeur ne quitte JAMAIS l'hôte ni les journaux Ansible.
#
# Règles appliquées :
#   1. Aucune valeur par défaut dans le dépôt : thotsecure_secret_key est vide
#      par défaut (voir defaults/main.yml). Une valeur fournie doit venir d'un
#      vault Ansible.
#   2. Génération sur l'hôte avec « openssl rand -hex 32 » (64 caractères
#      hexadécimaux, 256 bits d'entropie) — jamais côté machine de contrôle,
#      pour que la clé n'existe pas dans l'historique d'un poste.
#   3. Idempotence : on RELIT la clé déjà présente dans le fichier
#      d'environnement au lieu d'en régénérer une. Régénérer la clé à chaque
#      passage invaliderait toutes les sessions et jetons d'API en cours.
#   4. no_log: true sur toute tâche qui manipule la valeur, y compris la
#      relecture (slurp) : les journaux et les diffs --diff ne doivent jamais
#      contenir le secret.
#   5. Le fichier est écrit en 0600 root:thotsecure : lisible par le service,
#      modifiable par root uniquement.
#
# NOTE D'ARCHITECTURE — un seul écrivain :
#   Le contenu complet de {{ thotsecure_env_file }} est rendu par le template
#   thotsecure.env.j2 dans tasks/config.yml. Ce fichier-ci se contente de
#   MATÉRIALISER la valeur du secret dans le fact thotsecure_secret_key_effective,
#   puis d'écrire le fichier UNIQUEMENT s'il n'existe pas encore (bootstrap),
#   afin qu'aucune fenêtre ne laisse le service sans clé. config.yml converge
#   ensuite le fichier complet, avec la même valeur.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. État du fichier d'environnement
# -----------------------------------------------------------------------------
- name: "Secrets | Vérifier la présence du fichier d'environnement"
  ansible.builtin.stat:
    path: "{{ thotsecure_env_file }}"
  register: thotsecure_env_file_stat
  tags:
    - configure
    - secrets

- name: "Secrets | Relire le fichier d'environnement existant"
  # slurp renvoie le contenu en base64 : sans no_log, la clé apparaîtrait en
  # clair dans la sortie détaillée (-v) et dans les journaux du contrôleur.
  ansible.builtin.slurp:
    src: "{{ thotsecure_env_file }}"
  register: thotsecure_env_file_slurp
  no_log: true
  when: thotsecure_env_file_stat.stat.exists | default(false)
  tags:
    - configure
    - secrets

- name: "Secrets | Extraire la clé déjà présente dans le fichier"
  # regex_search avec MULTILINE : THOT_SECRET_KEY est la dernière ligne du
  # fichier, mais on ne veut dépendre ni de sa position ni de son ordre.
  ansible.builtin.set_fact:
    thotsecure_secret_key_existing: >-
      {{ ((thotsecure_env_file_slurp.content | default('') | b64decode)
          | regex_search('(?m)^THOT_SECRET_KEY=(.+)$', '\\1')
          | default('', true) | first | default('') | trim) }}
  no_log: true
  when: thotsecure_env_file_stat.stat.exists | default(false)
  tags:
    - configure
    - secrets

# -----------------------------------------------------------------------------
# 2. Génération de la clé si nécessaire
# -----------------------------------------------------------------------------
- name: "Secrets | Générer une clé de signature de 256 bits sur l'hôte"
  # openssl rand -hex 32 : 32 octets aléatoires cryptographiques, sortie en
  # 64 caractères hexadécimaux. openssl est installé par tasks/packages.yml.
  # command (pas shell) : la commande est statique, aucun shell n'est requis.
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - "-hex"
      - "32"
  register: thotsecure_secret_key_generated
  no_log: true
  changed_when: false
  check_mode: false
  when:
    # On ne génère QUE si : aucune clé fournie par variable, aucune clé déjà
    # présente sur l'hôte, et génération autorisée.
    - (thotsecure_secret_key | default('') | length) == 0
    - (thotsecure_secret_key_existing | default('') | length) == 0
    - thotsecure_generate_secret_key | bool
  tags:
    - configure
    - secrets

- name: "Secrets | Refuser explicitement toute clé vide ou invalide"
  # Contrôle de qualité AVANT écriture : une clé vide ou tronquée laisserait le
  # service démarrer avec une signature prévisible, ou refuser de démarrer.
  ansible.builtin.assert:
    that:
      - thotsecure_secret_key_effective | length == 64
      - thotsecure_secret_key_effective is match('^[0-9a-fA-F]{64}$')
    fail_msg: |-
      ============================================================================
      ARRÊT — la clé THOT_SECRET_KEY est vide ou invalide.
      ----------------------------------------------------------------------------
      Une clé a été attendue sous l'une de ces formes :
        - 64 caractères hexadécimaux (générés par « openssl rand -hex 32 ») ;
        - ou une valeur fournie via thotsecure_secret_key (vault Ansible).

      Longueur obtenue : {{ thotsecure_secret_key_effective | length }} (64 attendus).

      Causes possibles :
        - « openssl » est absent de l'hôte : installez-le puis relancez
          (apt-get install openssl / dnf install openssl) ;
        - thotsecure_generate_secret_key=false et thotsecure_secret_key vide :
          fournissez la clé via un vault, ou remettez la génération à true ;
        - la valeur fournie dans thotsecure_secret_key n'est pas hexadécimale :
          utilisez « openssl rand -hex 32 » ou
          « python -c "import secrets;print(secrets.token_hex(32))" ».

      Aucune écriture n'a été effectuée dans {{ thotsecure_env_file }}.
      ============================================================================
    success_msg: "Clé de signature validée ({{ thotsecure_secret_key_effective | length }} caractères hexadécimaux)."
    quiet: true
  vars:
    # Priorité : valeur fournie (vault) > clé déjà sur l'hôte > clé fraîchement
    # générée. On ne réécrit donc jamais une clé existante par surprise.
    thotsecure_secret_key_effective: >-
      {{ (thotsecure_secret_key | default(''))
         if (thotsecure_secret_key | default('') | length) > 0
         else ((thotsecure_secret_key_existing | default(''))
               if (thotsecure_secret_key_existing | default('') | length) > 0
               else (thotsecure_secret_key_generated.stdout | default('') | trim)) }}
  tags:
    - configure
    - secrets

- name: "Secrets | Mémoriser la clé effective pour le template d'environnement"
  # Fact consommé par templates/thotsecure.env.j2 (via tasks/config.yml).
  # no_log: true : la valeur reste masquée dans toute sortie Ansible.
  ansible.builtin.set_fact:
    thotsecure_secret_key_effective: >-
      {{ (thotsecure_secret_key | default(''))
         if (thotsecure_secret_key | default('') | length) > 0
         else ((thotsecure_secret_key_existing | default(''))
               if (thotsecure_secret_key_existing | default('') | length) > 0
               else (thotsecure_secret_key_generated.stdout | default('') | trim)) }}
  no_log: true
  tags:
    - configure
    - secrets

# -----------------------------------------------------------------------------
# 3. Clé d'amorçage de l'API
# -----------------------------------------------------------------------------
# Le défaut applicatif de THOT_BOOTSTRAP_API_KEY est « thot_BOOTSTRAP_changemebeforefirstuse » :
# une valeur publique et donc inutilisable en production. Plutôt que de laisser
# ce défaut en place, on génère une clé dédiée au premier passage, sans jamais
# la journaliser. Elle sert uniquement à créer le premier locataire / la
# première clé d'API, puis doit être remplacée par des clés nominatives.
- name: "Secrets | Générer une clé d'amorçage d'API si aucune n'est fournie"
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - "-hex"
      - "24"
  register: thotsecure_bootstrap_api_key_generated
  no_log: true
  changed_when: false
  check_mode: false
  when:
    - (thotsecure_bootstrap_api_key | default('') | length) == 0
    - thotsecure_generate_bootstrap_api_key | bool
  tags:
    - configure
    - secrets

- name: "Secrets | Mémoriser la clé d'amorçage effective"
  ansible.builtin.set_fact:
    # Préfixe « ao_ » conservé pour rester reconnaissable et compatible avec la
    # validation du format attendue par l'API.
    thotsecure_bootstrap_api_key_effective: >-
      {{ (thotsecure_bootstrap_api_key | default(''))
         if (thotsecure_bootstrap_api_key | default('') | length) > 0
         else ('ao_' ~ (thotsecure_bootstrap_api_key_generated.stdout | default('') | trim)) }}
  no_log: true
  tags:
    - configure
    - secrets

- name: "Secrets | Vérifier que la clé d'amorçage a bien été produite"
  ansible.builtin.assert:
    that:
      - thotsecure_bootstrap_api_key_effective | length >= 32
      - thotsecure_bootstrap_api_key_effective is not search('change_me')
    fail_msg: |-
      ARRÊT — aucune clé d'amorçage d'API valide n'a pu être produite.
      THOT_BOOTSTRAP_API_KEY ne doit jamais rester sur la valeur de
      développement « thot_BOOTSTRAP_changemebeforefirstuse » : cette clé donne accès à l'API
      d'administration d'Thot Secure.

      Solutions :
        - vérifiez que « openssl » est présent sur l'hôte ;
        - ou fournissez thotsecure_bootstrap_api_key via un vault Ansible ;
        - ou, pour un environnement jetable uniquement, mettez
          thotsecure_generate_bootstrap_api_key: false en assumant le risque
          (déconseillé en production).
    success_msg: "Clé d'amorçage d'API produite ({{ thotsecure_bootstrap_api_key_effective | length }} caractères)."
    quiet: true
  no_log: true
  tags:
    - configure
    - secrets

# -----------------------------------------------------------------------------
# 4. Écriture du fichier d'environnement (bootstrap uniquement)
# -----------------------------------------------------------------------------
- name: "Secrets | Écrire le fichier d'environnement initial en 0600 (première installation)"
  # Ce n'est PAS le rendu final : tasks/config.yml déploie ensuite le template
  # complet thotsecure.env.j2 avec la même clé. Cette écriture garantit seulement
  # qu'aucun état intermédiaire ne laisse le service sans clé.
  # copy + content : pas de fichier temporaire sur l'hôte, donc aucun secret ne
  # risque de traîner dans /tmp.
  ansible.builtin.copy:
    content: |
      # Thot Secure — fichier d'environnement minimal (complété par tasks/config.yml)
      # Ce fichier contient un secret : permissions 0600 root:thotsecure.
      THOT_SECRET_KEY={{ thotsecure_secret_key_effective }}
    dest: "{{ thotsecure_env_file }}"
    owner: root
    group: "{{ thotsecure_group }}"
    mode: "0600"
  no_log: true
  when: not (thotsecure_env_file_stat.stat.exists | default(false))
  tags:
    - configure
    - secrets

# -----------------------------------------------------------------------------
# 5. Contrôle final des permissions
# -----------------------------------------------------------------------------
- name: "Secrets | Vérifier les permissions réelles du fichier d'environnement"
  # On relève le mode/UID/GID effectifs : un fichier de secrets lisible par
  # d'autres comptes est une fuite, même si l'écriture a été correcte.
  # command : stat n'a pas d'équivalent module pour ce contrôle de contrôle.
  ansible.builtin.command:
    argv:
      - stat
      - "-c"
      - "%a %U:%G"
      - "{{ thotsecure_env_file }}"
  register: thotsecure_env_file_mode
  changed_when: false
  failed_when: false
  check_mode: false
  # Pas de no_log ici : la sortie ne contient que des permissions, jamais la clé.
  tags:
    - configure
    - secrets

- name: "Secrets | Refuser un fichier de secrets aux permissions trop larges"
  ansible.builtin.assert:
    that:
      - (thotsecure_env_file_mode.stdout | default('')).split(' ')[0] in ['600', '0600']
      - (thotsecure_env_file_mode.stdout | default('')).split(' ')[1] == 'root:' ~ thotsecure_group
    fail_msg: >-
      {{ thotsecure_env_file }} a les permissions
      '{{ thotsecure_env_file_mode.stdout | default('inconnues') }}' au lieu de
      '600 root:{{ thotsecure_group }}'.
      Ce fichier contient THOT_SECRET_KEY : il ne doit être lisible que par
      root et par le compte du service.
      Corrigez : chown root:{{ thotsecure_group }} {{ thotsecure_env_file }} &&
                chmod 0600 {{ thotsecure_env_file }}
    success_msg: "Permissions conformes sur {{ thotsecure_env_file }} : {{ thotsecure_env_file_mode.stdout }}."
    quiet: true
  tags:
    - configure
    - secrets

- name: "Secrets | Rappel : la clé n'est jamais affichée"
  ansible.builtin.debug:
    msg:
      - "Origine de THOT_SECRET_KEY : {{ 'valeur fournie (vault attendu)' if (thotsecure_secret_key | default('') | length) > 0 else ('clé existante conservée sur l\\'hôte' if (thotsecure_secret_key_existing | default('') | length) > 0 else 'nouvelle clé générée avec openssl rand -hex 32') }}"
      - "Empreinte (sha256 tronquée, pour comparaison entre hôtes) : {{ thotsecure_secret_key_effective | hash('sha256') | truncate(12, true, '') }}"
      - "La valeur en clair n'est jamais journalisée : no_log: true sur toutes les tâches concernées."
      - "Rappel : {{ thotsecure_env_file }} est en 0600 root:{{ thotsecure_group }} et ne doit JAMAIS être commité."
  tags:
    - configure
    - secrets

# -----------------------------------------------------------------------------
# 6. Avertissement sur les valeurs par défaut applicatives
# -----------------------------------------------------------------------------
- name: "Secrets | Avertir si la clé d'amorçage par défaut est conservée"
  ansible.builtin.debug:
    msg: >-
      AVERTISSEMENT : thotsecure_generate_bootstrap_api_key=false et
      thotsecure_bootstrap_api_key est vide : l'application retombera sur sa
      valeur de développement « thot_BOOTSTRAP_changemebeforefirstuse », publique et donc
      inutilisable en production. Changez-la avant toute exposition réseau.
  when:
    - not (thotsecure_generate_bootstrap_api_key | bool)
    - (thotsecure_bootstrap_api_key | default('') | length) == 0
  tags:
    - configure
    - secrets
