; =============================================================================
; Thot Secure — exemple d'inventaire Ansible (format INI)
; -----------------------------------------------------------------------------
; Copiez ce fichier vers inventory.ini puis adaptez les hôtes :
;   cp inventory.example.ini inventory.ini
;
; ⚠ AUCUN SECRET DANS CE FICHIER — et aucun secret dans inventory.ini non plus.
;   Le fichier inventory.ini est ignoré par .gitignore, mais prenez l'habitude :
;   - clé SSH  : ansible_ssh_private_key_file (chemin local, jamais le contenu)
;   - secrets  : variables de vault (thotsecure_secret_key) ou génération sur
;                l'hôte via thotsecure_generate_secret_key: true (défaut)
; =============================================================================

# -----------------------------------------------------------------------------
# Groupe principal : les hôtes qui exécutent le service Thot Secure.
# Le playbook playbook-install.yml cible « hosts: thotsecure ».
# -----------------------------------------------------------------------------
[thotsecure]
; Remplacez par vos hôtes réels. Ici des adresses de documentation RFC 5737
; (192.0.2.0/24) qui ne doivent jamais être utilisées en production.
thotsecure-prod-01 ansible_host=192.0.2.10

; Deuxième nœud (décommentez pour un déploiement multi-hôtes).
; thotsecure-prod-02 ansible_host=192.0.2.11

# -----------------------------------------------------------------------------
# Variables de groupe : elles s'appliquent à tous les hôtes de [thotsecure].
#
# Priorité Ansible : les variables d'inventaire (ici) sont PLUS fortes que les
# defaults du rôle (roles/thotsecure/defaults/main.yml). Si vous définissez
# thotsecure_env=prod ici, c'est bien prod qui sera écrit dans le fichier
# d'environnement du service.
# -----------------------------------------------------------------------------
[thotsecure:vars]
; prod | dev — pilote THOT_ENV. En prod, le rôle refuse un certain nombre
; de réglages de développement (voir tasks/preflight.yml).
thotsecure_env=prod

; Nom de domaine public servi par Nginx (certificat TLS, redirection HTTPS,
; en-têtes X-Forwarded-*). Doit résoudre vers cet hôte.
thotsecure_domain=thotsecure.example.com

; letsencrypt | selfsigned | provided | none
;   letsencrypt : certbot + python3-certbot-nginx obtiennent le certificat
;                 automatiquement (port 80 doit être joignable depuis Internet).
;   selfsigned  : certificat auto-signé généré par openssl (labo / réseau fermé).
;   provided    : vous fournissez thotsecure_tls_cert_path / thotsecure_tls_key_path.
;   none        : pas de TLS ici (un autre équipement termine le TLS en amont).
thotsecure_tls_mode=letsencrypt

; E-mail de contact ACME (obligatoire pour Let's Encrypt). Mettez une adresse
; de votre domaine : c'est là que partent les alertes d'expiration.
thotsecure_le_email=security@example.com

; --- Connexion SSH (à adapter ou à surcharger par hôte) ----------------------
; ansible_user=ansible
; ansible_port=22
; ansible_ssh_private_key_file=~/.ssh/thotsecure_ed25519

; --- Identifiants d'API (NE PAS METTRE EN CLAIR ICI) -------------------------
; Laissez thotsecure_generate_secret_key=true (défaut) : la clé est générée sur
; l'hôte avec « openssl rand -hex 32 » et écrite dans /etc/thotsecure/thotsecure.env
; en 0600. Pour imposer une clé existante, utilisez un vault :
;
;   ansible-vault encrypt_string --vault-id prod@prompt --name 'thotsecure_secret_key'
;
; puis collez le bloc chiffré ci-dessous (ou dans group_vars/thotsecure/vault.yml,
; qui est la méthode recommandée et évite de polluer l'inventaire) :
; thotsecure_secret_key=!vault |
;           $ANSIBLE_VAULT;1.2;AES256;prod
;           66386439653...

# -----------------------------------------------------------------------------
# Groupe optionnel : hôte dédié au reverse-proxy Nginx, distinct du service.
# Utile si vous voulez un frontal Nginx sur une machine séparée de l'application.
# Ces hôtes ne reçoivent PAS le service Thot Secure : lancez le playbook avec
#   --limit thotsecure_reverse_proxy
# ou créez un second play si vous voulez les deux sur la même passe.
# -----------------------------------------------------------------------------
[thotsecure_reverse_proxy]
; thotsecure-rp-01 ansible_host=192.0.2.20

[thotsecure_reverse_proxy:vars]
; Le frontal doit joindre l'application. Renseignez l'IP privée du nœud Thot Secure.
; thotsecure_upstream_host=10.0.0.10

# -----------------------------------------------------------------------------
# EXEMPLE de composition de groupes (désactivé volontairement).
#
# ⚠ Attention au sens : mettre un groupe en enfant de [thotsecure] fait que ses
#   hôtes héritent de « hosts: thotsecure » et reçoivent donc AUSSI le service
#   Thot Secure. Ce n'est PAS ce que l'on veut pour un frontal dédié.
#
# Le sens correct pour un frontal dédié est l'inverse :
#   [thotsecure_reverse_proxy:children]
#   thotsecure
# c'est-à-dire « le frontal contient le nœud applicatif ».
#
# L'exemple ci-dessous n'est à décommenter que si vos machines frontales
# exécutent réellement l'application ET le reverse-proxy sur le même hôte.
# -----------------------------------------------------------------------------
; [thotsecure:children]
; thotsecure_reverse_proxy
