# =============================================================================
# Thot Secure — compte de service
# =============================================================================
# L'application n'appelle JAMAIS l'API Kubernetes : le jeton n'est donc pas
# monté dans les pods (`automountServiceAccountToken: false`). C'est une
# réduction de surface supplémentaire par rapport au comportement par défaut.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thotsecure
  namespace: thotsecure
  labels:
    app.kubernetes.io/name: thotsecure
    app.kubernetes.io/instance: thotsecure
    app.kubernetes.io/component: security-operations
    app.kubernetes.io/part-of: thotsecure
    app.kubernetes.io/managed-by: kubectl
  annotations:
    thotsecure.io/description: "Compte de service sans acces a l'API Kubernetes."
# Aucun jeton projeté dans le pod : aucun RBAC ne peut être détourné.
automountServiceAccountToken: false
# Aucun secret d'image n'est référencé ici : utilisez `imagePullSecrets` au
# niveau du Deployment si votre registre est privé (jamais de credentials
# en clair dans ce manifeste).
imagePullSecrets: []
