# =============================================================================
# Thot Secure — Ingress (TLS + prise en charge du WebSocket)
# =============================================================================
# Points d'attention :
#   * `proxy-read-timeout` / `proxy-send-timeout` allongés (3600 s) :
#     la console ouvre un WebSocket sur /api/v1/ws/stream et reçoit des frames
#     `heartbeat` espacées. Avec le défaut nginx (60 s), la connexion est coupée.
#   * `proxy-buffering: "off"` sur le flux : indispensable pour un WebSocket et
#     pour les exports d'audit en streaming.
#   * TLS obligatoire : `tls:` + redirection HTTP -> HTTPS.
#   * En-têtes de sécurité ajoutés côté proxy ; `X-Frame-Options: DENY` et une
#     CSP stricte protègent la console embarquée.
#   * `limit-rrs` / `limit-rps` : garde-fou anti-abus en amont de l'application
#     (qui applique déjà THOT_RATE_LIMIT_PER_MIN sur l'ingestion).
#
# Prérequis : un contrôleur d'Ingress (nginx) et cert-manager (ou un certificat
# fourni). Adaptez `ingressClassName`, `host` et `secretName`.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thotsecure
  namespace: thotsecure
  labels:
    app.kubernetes.io/name: thotsecure
    app.kubernetes.io/instance: thotsecure
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: thotsecure
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # --- Redirection HTTPS systématique -------------------------------------
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # --- WebSocket et flux longs --------------------------------------------
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # --- Taille de corps : payload d'événement borné côté application -------
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    # --- En-têtes de sécurité ------------------------------------------------
    nginx.ingress.kubernetes.io/server-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: no-referrer";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Content-Security-Policy: default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
      server_tokens off;
    # --- Anti-abus en amont --------------------------------------------------
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # --- Durcissement du contrôleur -----------------------------------------
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Le seul en-tête d'authentification accepté est X-API-Key ; on refuse
      # explicitement les en-têtes de contournement d'authentification.
      more_clear_input_headers "X-Forwarded-User" "X-Remote-User" "X-Api-Key";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - thotsecure.example.com
      # Certificat géré par cert-manager (ou Secret TLS provisionné hors bande).
      secretName: thotsecure-tls
  rules:
    - host: thotsecure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thotsecure
                port:
                  name: http
