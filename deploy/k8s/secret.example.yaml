# =============================================================================
# Thot Secure — EXEMPLE de Secret. NE CONTIENT AUCUN SECRET RÉEL.
# =============================================================================
# Ce fichier est un GABARIT : les valeurs sont des marqueurs explicites qui
# doivent être remplacés hors du dépôt. Ne committez JAMAIS un Secret rempli.
#
# Création recommandée (le secret ne transite alors ni par un fichier, ni par
# l'historique du shell, ni par `kubectl apply` en clair) :
#
#   # 1. Générer une clé de 32 octets (pepper des clés API + signature)
#   SECRET_KEY="$(openssl rand -hex 32)"
#
#   # 2. Créer le Secret directement, sans passer par un manifeste
#   kubectl -n thotsecure create secret generic thotsecure-secrets \
#     --from-literal=THOT_SECRET_KEY="${SECRET_KEY}" \
#     --from-literal=THOT_BOOTSTRAP_API_KEY="$(openssl rand -hex 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 3. Puis révoquer la clé de bootstrap dès la création d'une clé nominative
#   #    (POST /api/v1/tenants/{id}/keys) : la clé de bootstrap ne doit servir
#   #    qu'à l'amorçage.
#
# Alternatives préférées en production :
#   * External Secrets Operator / Sealed Secrets / SOPS : le manifeste versionné
#     ne contient qu'une référence, jamais la valeur.
#   * CSI Secrets Store (driver `secrets-store.csi.k8s.io`) : montage direct
#     depuis Vault / AWS Secrets Manager / Azure Key Vault.
#   * `kubectl create secret` en ligne de commande depuis un gestionnaire.
#
# Rotation : voir deploy/README.md -> « Rotation des clés API ».
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: thotsecure-secrets
  namespace: thotsecure
  labels:
    app.kubernetes.io/name: thotsecure
    app.kubernetes.io/instance: thotsecure
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: thotsecure
    app.kubernetes.io/managed-by: kubectl
  annotations:
    thotsecure.io/example: "true"
    thotsecure.io/rotation: "Voir deploy/README.md#rotation-des-cles-api"
type: Opaque
# -----------------------------------------------------------------------------
# `stringData` (et non `data`) : les valeurs sont fournies en clair et encodées
# par l'API server. REMPLACEZ LES DEUX VALEURS CI-DESSOUS. Les chaînes
# `REPLACE_ME_...` sont volontairement invalides pour qu'un apply accidentel
# ne puisse pas produire une instance fonctionnelle avec un secret connu.
# -----------------------------------------------------------------------------
stringData:
  # Pepper des clés API (hachage scrypt) + clé de signature. 32 octets minimum.
  # Génération : openssl rand -hex 32
  THOT_SECRET_KEY: "REPLACE_ME_openssl_rand_hex_32"
  # Clé admin initiale, affichée une seule fois. À révoquer après amorçage.
  # NE JAMAIS laisser la valeur de développement `thot_BOOTSTRAP_changemebeforefirstuse`.
  THOT_BOOTSTRAP_API_KEY: "REPLACE_ME_ao_bootstrap_key_to_revoke"
