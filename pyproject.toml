[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thotsecure"
version = "0.1.0"
description = "SOAR/CSPM défensif open source : collecte, détection, décision policy-as-code et contre-mesures réversibles pour MSP, MSSP, SOC, RSSI et DevOps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Thot Secure Authors" }]
keywords = [
  "security",
  "soar",
  "blue-team",
  "detection",
  "incident-response",
  "defensive-security",
  "msp",
  "soc",
  "policy-as-code",
  "audit-log",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://thotsecure.dev"
Documentation = "https://thotsecure.dev/docs"
Repository = "https://github.com/thot-corp/thot-secure"
Changelog = "https://github.com/thot-corp/thot-secure/blob/main/CHANGELOG.md"
Issues = "https://github.com/thot-corp/thot-secure/issues"
Security = "https://github.com/thot-corp/thot-secure/security/advisories/new"
Funding = "https://thotsecure.dev/support"

[project.scripts]
thotsecure = "thotsecure.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["thotsecure*"]

[tool.setuptools.package-data]
thotsecure = [
  "py.typed",
  "ui/templates/*.html",
  "ui/templates/**/*.html",
  "ui/static/css/*.css",
  "ui/static/js/*.js",
  "data/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
  "S101",   # assert autorisé dans les tests
  "S104",   # bind 0.0.0.0 est le comportement attendu d'un serveur
  "S311",   # random non cryptographique : jitter de backoff uniquement
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"sdks/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["thotsecure"]

[tool.mypy]
python_version = "3.11"
packages = ["thotsecure"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:thotsecure.*"]

[tool.coverage.run]
source = ["src/thotsecure"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
