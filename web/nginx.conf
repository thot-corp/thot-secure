# =============================================================================
# Thot Secure — nginx : service du SPA + reverse proxy de l'API.
#
# Ce fichier remplace **intégralement** `/etc/nginx/nginx.conf` de l'image
# `nginx:1.27-alpine` (voir `Dockerfile`), et non un fichier de `conf.d/` :
# c'est ce qui permet de définir `pid` sous `/tmp` et de tourner en utilisateur
# non privilégié.
#
# Points de sûreté :
#   * CSP stricte — `script-src 'self'`, **aucun** `unsafe-inline` pour les
#     scripts (le bundle Vite n'injecte aucun script en ligne). `style-src`
#     conserve `'unsafe-inline'` : React/Recharts posent des attributs `style`
#     et une CSP sans cette autorisation casserait les jauges ;
#   * `X-Frame-Options: DENY` + `frame-ancestors 'none'` : la console ne peut pas
#     être encadrée (anti-clickjacking) ;
#   * `Referrer-Policy: no-referrer` : aucune fuite d'URL vers un tiers ;
#   * journal d'accès en `$uri` et **non** `$request` : la clé API du flux
#     WebSocket (`?api_key=…`, contrat §4) ne doit jamais atterrir dans un journal ;
#   * `/metrics` n'est pas exposé par ce proxy (Prometheus scrape l'API en
#     interne, contrat §4.1) ;
#   * les sourcemaps (générées pour le diagnostic) ne sont pas servies.
#
# Note d'héritage nginx : `add_header` n'est **pas** hérité dès qu'un bloc enfant
# en déclare un. Tous les en-têtes de sécurité sont donc déclarés au niveau
# `server` et aucun `add_header` n'apparaît plus bas (le cache utilise `expires`).
# =============================================================================

# Pas de directive `user` : le conteneur démarre déjà sous l'utilisateur `nginx`
# (`USER nginx` dans le Dockerfile). La déclarer ici ne produirait qu'un
# avertissement « makes sense only if the master process runs with super-user
# privileges ».
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Aucune fuite de version dans les en-têtes et les pages d'erreur.
    server_tokens off;

    # `$uri` = chemin seul, sans chaîne de requête.
    log_format  soc  '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
    access_log  /dev/stdout  soc;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # THOT_MAX_BODY_BYTES = 2 Mio : marge pour l'encodage d'un lot d'événements.
    client_max_body_size    8m;
    client_body_timeout     30s;
    client_header_timeout   15s;
    large_client_header_buffers 4 16k;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript text/markdown
                      application/javascript application/json
                      application/sarif+json application/x-ndjson;

    # Requis pour l'upgrade WebSocket (contrat §4.8) : `Connection` dépend de
    # la demande d'`Upgrade` du client.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Résolution DNS de l'API.
    # 127.0.0.11 = DNS embarqué de Docker ; `proxy_pass` avec variable + resolver
    # permet à nginx de **démarrer** même si l'API n'est pas encore résolue
    # (sinon, un démarrage dans le désordre échoue au chargement de la config).
    # Hors Docker (k8s, hôte) : ajustez ce resolver (ex. kube-dns) ou remplacez
    # `proxy_pass $thot_backend;` par `proxy_pass http://thotsecure:8080;`.
    resolver          127.0.0.11 valid=10s ipv6=off;
    resolver_timeout  5s;

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # En-têtes de sécurité (hérités par tous les blocs ci-dessous).
        # ---------------------------------------------------------------------
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Le flux WebSocket est **même origine** (proxifié ci-dessous) : la
        # directive `connect-src 'self'` le couvre (CSP3, `'self'` inclut ws/wss).
        # Si vous servez l'API sur une autre origine, ajoutez-la explicitement
        # (ex. `connect-src 'self' wss://api.example`).

        # ---------------------------------------------------------------------
        # API Thot Secure (contrat §4) et console embarquée (§4.9).
        # ---------------------------------------------------------------------
        set $thot_backend  http://thotsecure:8080;

        location ~ ^/(api|ui|healthz|readyz|version|openapi\.json)(/|$) {
            proxy_pass $thot_backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket : en-têtes d'upgrade + délais longs (un flux d'astreinte
            # reste ouvert des heures) et aucun tampon.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            proxy_cache         off;
            proxy_request_buffering off;
        }

        # `/metrics` est réservé au réseau interne : non exposé par ce proxy.
        location = /metrics {
            return 404;
        }

        # Sourcemaps : produits pour le diagnostic hors production, jamais servis
        # publiquement (réduit la divulgation de la structure interne du code).
        # Pour les autoriser en environnement de test, commentez ce bloc.
        location ~* \.map$ {
            return 404;
        }

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        # ---------------------------------------------------------------------
        # SPA : `index.html` ne doit jamais être mis en cache (les noms hashés
        # des bundles changent à chaque livraison).
        # ---------------------------------------------------------------------
        location = /index.html {
            expires -1;
        }

        location = /healthz-dashboard {
            # Sonde locale du conteneur (le `/healthz` de l'API est plus haut).
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Bundles Vite : noms hachés, contenu immuable.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # Routage SPA : toute route inconnue retombe sur l'application
        # (`/findings`, `/audit`, … sont résolus côté client par BrowserRouter).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Refus explicite des fichiers sensibles susceptibles d'être copiés par
        # erreur dans le contexte de build.
        location ~* /\.(env|git|docker|eslintrc|npmrc) {
            return 404;
        }
    }
}
