# Workflow TEMPORAIRE — à supprimer après usage.
#
# Objet : la machine de développement n'a pas accès à PyPI, donc `ruff` ne peut pas y être
# installé, donc les corrections automatiques ne peuvent pas y être calculées. Ce workflow
# exécute `ruff --fix` sur un runner GitHub, imprime le diff complet dans le journal du job,
# et ne touche à RIEN : aucun commit, aucun push, aucune branche. Le diff est relu, appliqué
# localement, testé (381 tests) puis validé par la CI ordinaire avant d'être fusionné.
#
# Il n'existe que pour cette raison, et il est supprimé dans le commit qui applique le diff :
# un workflow qui réécrit du code sans revue n'a rien à faire dans un produit de sécurité.

name: Ruff autofix (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    name: Compute ruff autofixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Count diagnostics before
        run: ruff check --statistics . || true

      - name: Apply safe and unsafe autofixes
        run: |
          ruff check --fix --unsafe-fixes . || true
          ruff format . || true

      - name: Print the diff
        run: |
          echo "=====BEGIN-DIFF====="
          git --no-pager diff
          echo "=====END-DIFF====="

      - name: Remaining diagnostics after autofix
        run: |
          echo "=====BEGIN-REMAINING====="
          ruff check --output-format=concise . || true
          echo "=====END-REMAINING====="
          ruff check --statistics . || true
