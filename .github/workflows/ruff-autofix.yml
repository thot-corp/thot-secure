# Workflow TEMPORAIRE — à supprimer après usage.
#
# Objet : la machine de développement n'a pas accès à PyPI, donc `ruff` ne peut pas y être
# installé, donc les corrections automatiques ne peuvent pas y être calculées. Ce workflow
# exécute `ruff --fix` sur un runner GitHub, imprime le diff complet dans le journal du job,
# et ne touche à RIEN : aucun commit, aucun push, aucune branche. Le diff est relu, appliqué
# localement, testé (381 tests) puis validé par la CI ordinaire avant d'être fusionné.
#
# Il n'existe que pour cette raison, et il est supprimé dans le commit qui applique le diff :
# un workflow qui réécrit du code sans revue n'a rien à faire dans un produit de sécurité.

name: Ruff autofix (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    name: Compute ruff autofixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Ecriture limitee a cette execution : le workflow pousse les corrections sur une
      # branche jetable `chore/ruff-autofix`, jamais sur `main`. Le resultat y est relu,
      # applique et teste localement avant tout merge.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Count diagnostics before
        run: ruff check --statistics . || true

      - name: Apply safe and unsafe autofixes
        run: |
          ruff check --fix --unsafe-fixes . || true
          ruff format . || true

      - name: Print the diff
        run: |
          echo "=====BEGIN-DIFF====="
          git --no-pager diff
          echo "=====END-DIFF====="

      - name: Remaining diagnostics after autofix
        run: |
          echo "=====BEGIN-REMAINING====="
          ruff check --output-format=concise . || true
          echo "=====END-REMAINING====="
          ruff check --statistics . || true

      - name: Publish the result on a throwaway branch
        # Transfert fiable du resultat : un diff de 11 000 lignes recopie depuis un journal de
        # job peut etre altere (GitHub retire les espaces en fin de ligne de ses journaux), ce
        # qui a fait echouer l'application du patch pour cinq fichiers. Une branche, elle, est
        # recuperee telle quelle par `git fetch`.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/ruff-autofix
          git add -A
          git commit -m "chore(lint): corrections automatiques ruff (branche jetable)" || echo "aucun changement"
          git push --force origin chore/ruff-autofix
