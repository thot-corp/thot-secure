# Workflow TEMPORAIRE — à supprimer dès le verrou régénéré.
#
# Pourquoi il existe : npm n'est pas installable sur la machine de développement (aucun accès au
# registre), et le verrou du dépôt est corrompu — `npm ci` échoue sur `EINTEGRITY`, une empreinte
# enregistrée qui ne correspond plus à ce que le registre sert. Un `npm install` sur un verrou
# corrompu peut conserver l'entrée fautive : ce workflow **supprime donc le verrou** avant de le
# régénérer, puis prouve le résultat avec un `npm ci` propre.
#
# Il ne modifie rien d'autre et publie son résultat sur une branche jetable.

name: Web lockfile (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Regenerate web/package-lock.json from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Regenerate the lockfile from scratch
        working-directory: web
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --no-audit --no-fund
          node -e "console.log('paquets verrouilles :', Object.keys(require('./package-lock.json').packages).length)"
          node -e "console.log('eslint :', require('./package-lock.json').packages['node_modules/eslint'].version)"

      - name: Prove it with a clean npm ci
        working-directory: web
        run: |
          echo "=====BEGIN-CI====="
          rm -rf node_modules
          npm ci && echo "npm ci : OK" || echo "npm ci : ECHEC"
          echo "=====END-CI====="

      - name: Report the state of the dashboard
        working-directory: web
        run: |
          echo "=====BEGIN-TYPECHECK====="
          npm run typecheck || true
          echo "=====END-TYPECHECK====="
          echo "=====BEGIN-BUILD====="
          npm run build || true
          echo "=====END-BUILD====="
          echo "=====BEGIN-LINT====="
          npm run lint || true
          echo "=====END-LINT====="

      - name: Publish the result on a throwaway branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/web-lockfile
          git add web/package.json web/package-lock.json
          git commit -m "build(web): verrou regenere a partir de zero" || echo "aucun changement"
          git push --force origin chore/web-lockfile
