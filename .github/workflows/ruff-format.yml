# Workflow TEMPORAIRE — à supprimer après usage.
#
# `ruff check .` est vert, mais `ruff format --check .` signale encore des fichiers que le
# formateur remettrait en forme : les corrections manuelles ont introduit des concaténations
# implicites que ruff format préfère joindre. Le formateur n'est pas installable localement
# (aucun accès à PyPI), donc il tourne ici, sur une branche jetable, et le résultat est récupéré
# par `git fetch` puis relu et testé avant tout merge.

name: Ruff format (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Apply ruff format on a throwaway branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff --version

      - name: Format
        run: |
          ruff format .
          echo "=====BEGIN-DIFF====="
          git --no-pager diff --stat
          git --no-pager diff
          echo "=====END-DIFF====="

      - name: Verify the result
        run: |
          echo "=====BEGIN-VERIFY====="
          ruff check . || true
          ruff format --check .
          echo "=====END-VERIFY====="

      - name: Publish on a throwaway branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/ruff-format
          git add -A
          git commit -m "style(lint): ruff format (branche jetable)" || echo "aucun changement"
          git push --force origin chore/ruff-format
