# Canaux de soutien officiels de Thot Secure.
#
# ⚠️ RÈGLE DE SÛRETÉ : ne déclarer ici QUE des comptes et des URL que le projet contrôle
# réellement et a vérifiés. Un identifiant de plateforme laissé par défaut peut appartenir à
# quelqu'un d'autre : le bouton « Sponsor » enverrait alors les dons à un tiers. C'est un
# vecteur de fraude, pas une simple coquille de configuration.
#
# Pour réactiver un canal : créer le compte, vérifier qu'il est bien le vôtre (page publique,
# historique, cohérence avec le dépôt), PUIS décommenter la ligne correspondante.

# GitHub Sponsors : valide dès que l'organisation thot-corp est inscrite au programme.
# Tant qu'elle ne l'est pas, GitHub n'affiche simplement pas de bouton, sans erreur.
